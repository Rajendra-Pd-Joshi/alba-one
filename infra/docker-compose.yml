    build: { context: .., dockerfile: apps/api/Dockerfile.mcp, args: { MCP_SERVER: departments, MCP_EXTRA: mcp-departments } }
    environment: { MCP_SERVER: departments, MCP_PORT: "8103" }
    ports: ["8103:8103"]
    profiles: ["core", "all"]

  mcp-decision_history:
