# ==============================================================================
# ALBA ONE — Docker Compose (infra/docker-compose.yml)
# Uses `x-mcp-service` YAML anchor and Compose profiles (`core`, `domain`, `external`, `all`)
# so developers only launch the MCP servers they need:
#   make mcp-up PROFILE=core
# ==============================================================================

x-mcp-service: &mcp-service
  build:
    context: ..
    dockerfile: apps/api/Dockerfile.mcp
  restart: unless-stopped
  env_file:
    - ../.env
  read_only: true
  tmpfs:
    - /tmp
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: alba-one-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alba_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-alba_one}
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - alba_pg_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-alba} -d $${POSTGRES_DB:-alba_one}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: alba-one-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - alba_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: alba-one-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://alba:alba_dev_password@postgres:5432/alba_one
      REDIS_URL: redis://redis:6379/0
      MODEL_CONFIG_PATH: /app/config/models.yaml
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Core Profile MCP Servers ---
  mcp-knowledge_base:
    <<: *mcp-service
    build: { context: .., dockerfile: apps/api/Dockerfile.mcp, args: { MCP_SERVER: knowledge_base, MCP_EXTRA: mcp-knowledge-base } }
    environment: { MCP_SERVER: knowledge_base, MCP_PORT: "8101" }
    ports: ["8101:8101"]
    profiles: ["core", "all"]

  mcp-sql_readonly:
    <<: *mcp-service
    build: { context: .., dockerfile: apps/api/Dockerfile.mcp, args: { MCP_SERVER: sql_readonly, MCP_EXTRA: mcp-sql-readonly } }
    environment: { MCP_SERVER: sql_readonly, MCP_PORT: "8102" }
    ports: ["8102:8102"]
    profiles: ["core", "all"]

  mcp-departments:
