[project]
name = "alba-one-workspace"
version = "0.1.0"
description = "ALBA ONE — Enterprise Decision OS (意思決定OS) by ALBACONNECT Inc."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/api/tests", "evals", "redteam"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = ["apps/api/src"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src", "."]
asyncio_mode = "auto"
