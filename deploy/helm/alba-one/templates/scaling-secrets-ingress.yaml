{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alba-one-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alba-one-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alba-one-api-pdb
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: alba-one-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alba-one-external-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: aws-secretsmanager-ap-northeast-1
    kind: ClusterSecretStore
  target:
    name: alba-one-external-secrets
    creationPolicy: Owner
  data:
    - secretKey: GATEWAY_API_KEY
      remoteRef:
        key: alba-one/{{ .Values.global.appEnv }}/providers
        property: GATEWAY_API_KEY
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: alba-one/{{ .Values.global.appEnv }}/providers
        property: OPENAI_API_KEY
    - secretKey: PINECONE_API_KEY
      remoteRef:
        key: alba-one/{{ .Values.global.appEnv }}/providers
        property: PINECONE_API_KEY
    - secretKey: COHERE_API_KEY
      remoteRef:
        key: alba-one/{{ .Values.global.appEnv }}/providers
        property: COHERE_API_KEY
    - secretKey: INTERNAL_S2S_CURRENT_SECRET
      remoteRef:
        key: alba-one/{{ .Values.global.appEnv }}/s2s
        property: current_secret
    - secretKey: INTERNAL_S2S_PREVIOUS_SECRET
      remoteRef:
        key: alba-one/{{ .Values.global.appEnv }}/s2s
        property: previous_secret
---
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alba-one-edge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alba-one-web
                port:
                  number: 3000
{{- end }}
---
{{- if .Values.devInClusterStores.enabled }}
# ==============================================================================
# DEV / KIND ONLY — NOT FOR PRODUCTION (`devInClusterStores.enabled: true`)
# Production uses managed RDS PostgreSQL & ElastiCache Redis via Terraform.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alba-one-dev-postgres-not-for-prod
  labels:
    alba.albaconnect.co.jp/profile: dev-only-not-for-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alba-one-dev-postgres
  template:
    metadata:
      labels:
        app: alba-one-dev-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
{{- end }}
