# ==============================================================================
# ALBA ONE — Argo Rollouts Canary AnalysisTemplate
# (`deploy/observability/argo-rollout-analysis.yaml` — Phase 11)
# Automatically aborts and rolls back a canary promotion if
# `redteam_critical_bypass_count > 0` or `redteam_last_run_age_seconds > 86400`.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: alba-one-redteam-canary-gate
  namespace: alba-one-prod
spec:
  args:
    - name: candidate-version
  metrics:
    - name: redteam-zero-critical-bypass
      interval: 2m
      failureLimit: 0
      successCondition: result[0] == 0
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            sum(redteam_critical_bypass_count{version="{{args.candidate-version}}"})

    - name: redteam-dead-mans-switch-freshness
      interval: 5m
      failureLimit: 0
      successCondition: result[0] < 86400
      provider:
        prometheus:
          address: http://prometheus.monitoring.svc:9090
          query: |
            max(redteam_last_run_age_seconds{version="{{args.candidate-version}}"})
