    name_ja: "SLA超過確率"
    name_en: "SLA Breach Probability"
    unit: "probability"
    direction: "lower_better"
    kind: "hard_constraint"
    required: true
    hard_limit: 0.35
    source:
      source_id: "delivery_planning.calculate_sla_breach_probability"
      locator: "value"
    weight: 0.50

  - id: "route_cost_jpy"
    name_ja: "想定コスト（円）"
    name_en: "Estimated Cost (JPY)"
    unit: "JPY"
    direction: "lower_better"
    kind: "soft_criterion"
    required: true
    source:
      source_id: "delivery_planning.calculate_route_cost_jpy"
      locator: "value"
    weight: 0.30

  - id: "reversibility"
    name_ja: "判断の可逆性"
    name_en: "Decision Reversibility"
    unit: "qualitative"
    direction: "n/a"
    kind: "soft_criterion"
    required: false
    source:
      source_id: "qualitative"
      locator: "reversibility"
    weight: 0.20
