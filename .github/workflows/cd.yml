name: ALBA ONE CD (Staging Auto-Deploy & Production Gated Release)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-sign-and-deploy-staging:
    name: Build, Sign Images & Sync Staging (ArgoCD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Dockerfiles & .dockerignore
        run: bash ci/scripts/check_images.sh

      - name: Run offline safety & red-team regression gate
        run: python3 evals/red_team.py --target safe --repeats 1

      - name: Validate Helm chart templates (prod, staging, dev)
        run: |
          helm lint deploy/helm/alba-one -f deploy/helm/alba-one/values.yaml
          helm lint deploy/helm/alba-one -f deploy/helm/alba-one/values.yaml -f deploy/helm/alba-one/values-staging.yaml

  promote-production:
    name: Production Release Gate (Manual Approval Required)
    needs: [build-sign-and-deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://alba-one.albaconnect.co.jp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production startup checks & config hygiene
        run: bash ci/scripts/check_images.sh
