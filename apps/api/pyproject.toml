[project]
name = "alba-one"
version = "1.0.0"
description = "ALBA ONE API — Decision OS Backend (ALBACONNECT Inc.)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.5.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
    "alembic>=1.13.3,<2.0.0",
    "psycopg[binary,pool]>=3.2.2,<4.0.0",
    "redis>=5.1.0,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "cryptography>=43.0.1,<45.0.0",
    "PyJWT[crypto]>=2.9.0,<3.0.0",
    "langchain>=0.3.3,<0.4.0",
    "langchain-core>=0.3.10,<0.4.0",
    "langchain-openai>=0.2.2,<0.3.0",
    "langchain-mcp-adapters>=0.1.0,<0.2.0",
    "langgraph>=0.2.35,<0.3.0",
    "langgraph-checkpoint-postgres>=2.0.2,<3.0.0",
    "langsmith>=0.1.135,<0.2.0",
    "mcp>=1.1.0,<2.0.0",
    "cohere>=5.11.0,<6.0.0",
    "boto3>=1.35.0,<2.0.0",
]

[project.optional-dependencies]
# Per-MCP-server isolated dependency extras used by apps/api/Dockerfile.mcp
mcp-knowledge-base = ["pinecone>=5.3.1,<6.0.0", "sudachipy>=0.6.8,<0.7.0", "sudachidict-core>=20240716"]
mcp-sql-readonly = ["psycopg[binary]>=3.2.2,<4.0.0"]
mcp-departments = []
mcp-approvals = ["psycopg[binary]>=3.2.2,<4.0.0"]
mcp-experiment-tracking = ["mlflow-skinny>=2.16.0,<3.0.0"]
mcp-benchmark-registry = []
mcp-decision-history = ["psycopg[binary]>=3.2.2,<4.0.0"]
mcp-memory = ["mem0ai>=0.1.29,<0.2.0"]
mcp-delivery-planning = []
mcp-staffing = []
mcp-vessel-allocation = []
mcp-document-extraction = ["pypdf>=5.0.0,<7.0.0", "openpyxl>=3.1.5,<4.0.0", "python-docx>=1.1.2,<2.0.0", "pillow>=11.0.0,<12.0.0"]
mcp-deployment-status = []
mcp-web-search = ["beautifulsoup4>=4.12.0,<5.0.0"]
mcp-news-search = []
mcp-competitor-intel = []
mcp-model-benchmarks = []
mcp-papers = []
mcp-github-releases = []
mcp-market-data = []
mcp-weather-marine = []
mcp-regulatory-jp = []

dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "fakeredis[lua]>=2.25.1,<3.0.0",
    "lupa>=2.2,<3.0",
    "ruff>=0.6.9,<1.0.0",
    "mypy>=1.11.2,<2.0.0",
    "types-PyYAML>=6.0.12",
    "types-redis>=4.6.0",
    "deepeval>=1.4.5,<2.0.0",
    "pyrit>=0.8.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alba_one"]
